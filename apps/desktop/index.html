<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/Icon-iOS-Default-1024@1x.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem("fragment-theme") === "dark"
              ? "dark"
              : "light";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <title>Fragment</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
